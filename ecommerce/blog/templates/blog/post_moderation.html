<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modération des articles</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        .post {
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .post h2 {
            margin-top: 0;
            color: #2980b9;
        }
        .btn {
            display: inline-block;
            padding: 8px 15px;
            margin-right: 10px;
            margin-bottom: 10px;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-success {
            background-color: #2ecc71;
        }
        .btn-success:hover {
            background-color: #27ae60;
        }
        .btn-danger {
            background-color: #e74c3c;
        }
        .btn-danger:hover {
            background-color: #c0392b;
        }
        .btn-primary {
            background-color: #3498db;
        }
        .btn-primary:hover {
            background-color: #2980b9;
        }
        .empty-message {
            font-style: italic;
            color: #7f8c8d;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Articles en attente d'approbation</h1>

        {% for post in pending_posts %}
        <div class="post">
            <h2>{{ post.title }}</h2>
            <p><strong>Auteur:</strong> {{ post.author.username }}</p>
            <p><strong>Date:</strong> {{ post.published_date }}</p>
            <p>{{ post.content|truncatewords:30 }}</p>
            <div class="actions">
                <a href="{% url 'blog:approve_post' post.slug %}" class="btn btn-success">Approuver</a>
                <a href="{% url 'blog:reject_post' post.slug %}" class="btn btn-danger">Rejeter</a>
                <a href="{% url 'blog:post_detail' post.slug %}" class="btn btn-primary">Voir en détail</a>
            </div>
        </div>
        {% empty %}
        <p class="empty-message">Aucun article en attente d'approbation.</p>
        {% endfor %}
    </div>
</body>
</html>
