{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Email envoyé</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .done-container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 1rem;
        }
        p {
            color: #555;
            margin-bottom: 1.5rem;
        }
        .links a {
            color: #4CAF50;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="done-container">
        <h1>Email envoyé</h1>
        <p>Nous vous avons envoyé par email les instructions pour réinitialiser votre mot de passe.</p>
        <p>Si vous ne recevez pas d'email, vérifiez que vous avez saisi l'adresse avec laquelle vous vous êtes inscrit et vérifiez votre dossier spam.</p>
        <div class="links">
            <a href="{% url 'login' %}">Retour à la connexion</a>
        </div>
    </div>
</body>
</html>
